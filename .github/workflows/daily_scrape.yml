name: Hotel Scraper Test Runs (Feb 2027)

on:
  schedule:
    # Dnes 19.11. o 22:00 CET = 21:00 UTC
    - cron: '0 21 19 11 *'
    # Zajtra 20.11. o 02:00 CET = 01:00 UTC
    - cron: '0 1 20 11 *'
    # Zajtra 20.11. o 03:00 CET = 02:00 UTC
    - cron: '0 2 20 11 *'
    # Zajtra 20.11. o 05:00 CET = 04:00 UTC
    - cron: '0 4 20 11 *'
    # Zajtra 20.11. o 06:00 CET = 05:00 UTC
    - cron: '0 5 20 11 *'

  # Ručné spustenie jedným kliknutím v záložke Actions
  workflow_dispatch:
    inputs:
      check_in:
        description: 'Dátum príchodu (YYYY-MM-DD)'
        required: true
        default: '2027-02-15'
      check_out:
        description: 'Dátum odchodu (YYYY-MM-DD)'
        required: true
        default: '2027-02-17'
      guests:
        description: 'Počet dospelých'
        required: true
        default: '2'
      hotels:
        description: 'Filter hotela (voliteľné, napr. Grand Hotel Bellevue)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Stiahnutie kódu z repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Inštalácia knižníc a Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Príprava priečinkov pre reporty, logy a screenshoty
        run: mkdir -p reports logs screenshots

      - name: Spustenie zberu cien
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          HOTEL_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHECK_IN="${{ github.event.inputs.check_in }}"
            CHECK_OUT="${{ github.event.inputs.check_out }}"
            GUESTS="${{ github.event.inputs.guests }}"
            if [ -n "${{ github.event.inputs.hotels }}" ]; then
              HOTEL_FLAG="--hotels \"${{ github.event.inputs.hotels }}\""
            fi
          else
            UTC_HOUR=$(date -u +%H)
            case "$UTC_HOUR" in
              21) START_DAY=$((1 + RANDOM % 6)) ;;   # 22:00 CET -> 1. až 6. feb
              01) START_DAY=$((7 + RANDOM % 6)) ;;   # 02:00 CET -> 7. až 12. feb
              02) START_DAY=$((13 + RANDOM % 6)) ;;  # 03:00 CET -> 13. až 18. feb
              04) START_DAY=$((19 + RANDOM % 5)) ;;  # 05:00 CET -> 19. až 23. feb
              05) START_DAY=$((24 + RANDOM % 3)) ;;  # 06:00 CET -> 24. až 26. feb
              *)  START_DAY=$((1 + RANDOM % 25)) ;;
            esac

            END_DAY=$((START_DAY + 2))
            CHECK_IN=$(printf "2027-02-%02d" "$START_DAY")
            CHECK_OUT=$(printf "2027-02-%02d" "$END_DAY")
            GUESTS="2"
          fi

          echo "=========================================="
          echo "Spúšťam testovací beh pre termín: $CHECK_IN -> $CHECK_OUT (hostia: $GUESTS)"
          echo "=========================================="
          eval python main.py --check-in "$CHECK_IN" --check-out "$CHECK_OUT" --guests "$GUESTS" $HOTEL_FLAG

      - name: Uloženie Excel reportu, logov a screenshotov na stiahnutie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-prices-feb2027-${{ github.run_number }}
          path: |
            reports/*.xlsx
            logs/**
            screenshots/**
          if-no-files-found: ignore
